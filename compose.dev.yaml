# Opt in with: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  app:
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      vite:
        condition: service_healthy

  vite:
    image: node:22-bookworm-slim
    init: true
    working_dir: /var/www/html
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && exec node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/@vite/client').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20

volumes:
  vendor_data:
  node_modules:
