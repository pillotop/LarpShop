services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: larp-shop
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: larpshop
      DB_USERNAME: larpshop
      DB_PASSWORD: ${DB_PASSWORD}

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SCHEME: "null"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
      image: axllent/mailpit:latest
      ports:
        - "127.0.0.1:8025:8025"
      expose:
        - "1025"
      restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: larpshop
      MYSQL_USER: larpshop
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
