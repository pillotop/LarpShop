# Standalone hand-in environment. Does not read .env or compose.override.yaml.
name: larpshop-demo

x-demo-environment: &demo-environment
  APP_NAME: LarpShop
  APP_ENV: local
  APP_DEBUG: "false"
  APP_KEY: ${DEMO_APP_KEY:-}
  APP_URL: http://localhost:${DEMO_HTTP_PORT:-8080}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: larpshop
  DB_USERNAME: larpshop
  DB_PASSWORD: ${DEMO_DB_PASSWORD:-}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: demo@example.test
  MAIL_FROM_NAME: LarpShop Demo
  WALLET_SIMULATION_ENABLED: "true"
  STRIPE_ENABLED: "false"
  MOMO_ENABLED: "false"
  ZALOPAY_ENABLED: "false"
  VNPAY_ENABLED: "false"

services:
  app:
    image: larpshop-demo:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *demo-environment
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8080}:8000"
    volumes:
      - demo_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20

  scheduler:
    image: larpshop-demo:local
    environment: *demo-environment
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - demo_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: larpshop
      MYSQL_USER: larpshop
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:-}
    volumes:
      - demo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${DEMO_MAIL_PORT:-8026}:8025"

volumes:
  demo_mysql:
  demo_storage:
